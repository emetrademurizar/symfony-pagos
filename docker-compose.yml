services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: symfony-pagos:prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    volumes:
      - jwt_keys:/app/config/jwt
      - app_var:/app/var
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8000/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  jwt_keys:
  app_var:
