services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: symfony-pagos:dev
    container_name: php82
    volumes:
      - ./:/app
    working_dir: /app
    env_file:
      - .env
    environment:
      APP_ENV: dev
      APP_PORT: ${APP_PORT:-8000}
    command: symfony serve --no-tls --port=${APP_PORT:-8000} --allow-http --allow-all-ip
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
